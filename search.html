    const resultsContainer = document.getElementById('resultsList');
    const filteredProducts = products.filter(item => item.name.toLowerCase().includes(query) || item.path.toLowerCase().includes(query));

      filteredProducts.forEach(item => {
        resultsContainer.innerHTML += `
          <div class="item-card">
            <a href="${item.link}"><strong>${item.name}</strong></a><br>
            <small>Path: ${item.path}</small><br>
            <img src="${item.image}" alt="${item.name}">
